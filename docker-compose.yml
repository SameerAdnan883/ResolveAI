version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=qwen
      - QWEN_MODEL=qwen3.5:4b
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - QWEN_LOW_REASONING=true
      - ENVIRONMENT=production
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./resolveai.db:/app/resolveai.db
      - ./resolveai_checkpoints.db:/app/resolveai_checkpoints.db
      - ./chroma_db:/app/chroma_db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
